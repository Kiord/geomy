name: Publish geomy Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag and package versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package built site
        shell: bash
        run: |
          cd dist
          zip -r "../geomy-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "geomy-${GITHUB_REF_NAME}.zip#Built geomy website" \
            --verify-tag \
            --generate-notes \
            --title "geomy ${GITHUB_REF_NAME}"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
            rust-targets: ''
          - platform: ubuntu-22.04
            args: '--bundles deb'
            rust-targets: ''
          - platform: macos-latest
            args: '--bundles dmg --target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - name: Synchronize desktop version
        run: node scripts/sync-tauri-version.js

      - name: Build and upload desktop application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: 'geomy_[version]_[platform]_[arch][setup][ext]'

      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $portableName = "geomy_${releaseVersion}_windows_x64_portable.exe"
          Copy-Item "src-tauri\target\release\geomy.exe" $portableName
          gh release upload $env:GITHUB_REF_NAME $portableName --clobber

      - name: Upload standalone Linux executable
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          standalone_name="geomy_${release_version}_linux_x64"
          cp "src-tauri/target/release/geomy" "$standalone_name"
          chmod +x "$standalone_name"
          gh release upload "$GITHUB_REF_NAME" "$standalone_name" --clobber
