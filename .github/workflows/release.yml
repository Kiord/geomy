name: Publish Geomy Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag and package versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package built site
        shell: bash
        run: |
          cd dist
          zip -r "../geomy-${GITHUB_REF_NAME}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "geomy-${GITHUB_REF_NAME}.zip#Built Geomy website" \
            --verify-tag \
            --generate-notes \
            --title "Geomy ${GITHUB_REF_NAME}"
